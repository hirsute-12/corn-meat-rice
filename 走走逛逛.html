<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走走逛逛 - 彰化景點指南</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f0f4f8; /* 換成清爽的淺藍灰色調，代表戶外踏青 */
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #2e8b57; /* 森林綠，代表大自然與景點 */
            color: white;
            text-align: center;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .spot-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .spot-card:hover {
            transform: translateY(-5px);
        }
        .spot-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #ddd;
        }
        .spot-info {
            padding: 20px;
        }
        h2 {
            color: #27ae60;
            margin-top: 0;
        }
        .back-home {
            display: inline-block;
            padding: 12px 30px;
            background-color: #2e8b57;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .back-home:hover {
            background-color: #1e5e3a;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            color: white;
        }
        footer {
            text-align: center;
            font-size: 0.9rem;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>走走逛逛：彰化必遊景點</h1>
        <p>漫步半線古城，感受人文與自然的交織</p>
    </header>

    <div class="spot-card">
        <img src="https://tourism.chcg.gov.tw/upload/27/2023102016023531186.jpg" alt="八卦山大佛" class="spot-image">
        <div class="spot-info">
            <h2>1. 八卦山大佛風景區</h2>
            <p>彰化最具代表性的地標！除了參拜莊嚴的大佛，還可以走上天空步道，在高處俯瞰整個彰化市景，尤其是夕陽時分非常浪漫。</p>
        </div>
    </div>

    <div class="spot-card">
        <img src="https://tourism.chcg.gov.tw/upload/27/2023051214214634495.jpg" alt="扇形車庫" class="spot-image">
        <div class="spot-info">
            <h2>2. 扇形車庫</h2>
            <p>全台碩果僅存的扇形車庫，是鐵道迷的聖地。看著火車頭在轉車盤上移動，彷彿走進了時光隧道，見證台灣鐵道的發展史。</p>
        </div>
    </div>

    <div class="spot-card">
        <img src="https://supertaste.tvbs.com.tw/_next/image?url=https%3A%2F%2Fcc.tvbs.com.tw%2Fimg%2Fprogram%2F_data%2Fi%2Fupload%2F2023%2F01%2F31%2F20230131163229-19868ee7-la.jpg&w=768&q=75" alt="鹿港老街" class="spot-image">
        <div class="spot-info">
            <h2>3. 鹿港老街</h2>
            <p>「一府二鹿三艋舺」，來到彰化怎能不逛鹿港？紅磚巷弄、天后宮、龍山寺，每一處都充滿濃濃的古色古香與歷史韻味。</p>
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <a href="互動式網頁設計期中報告.html" class="back-home">回到首頁</a>
    </div>

    <footer>
        <p>&copy; 2026 彰化一網通</p>
    </footer>
</div>
</body>
</html>
