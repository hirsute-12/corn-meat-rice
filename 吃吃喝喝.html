<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吃吃喝喝 - 彰化美食地圖</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f9f4ef;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #e67e22;
            color: white;
            text-align: center;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .food-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .food-card:hover {
            transform: translateY(-5px);
        }
        .food-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #ddd;
        }
        .food-info {
            padding: 20px;
        }
        h2 {
            color: #d35400;
            margin-top: 0;
        }
		.back-home {
            display: inline-block;
            padding: 12px 30px;
            background-color: #e67e22; /* 與標題一致的橘色 */
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .back-home:hover {
            background-color: #d35400; /* 深橘色 */
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            color: white;
        }
        .footer {
            text-align: center;
            font-size: 0.9rem;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>吃吃喝喝：彰化知名美食</h1>
        <p>探索彰化最道地的在地滋味</p>
    </header>

    <div class="food-card">
        <img src="https://imgproxy.icook.network/safe/rt:fit/w:1080/el:0/q:80/plain/http://tokyo-kitchen.icook.tw.s3.amazonaws.com/uploads/recipe/cover/193513/4f4604bd32819a5a.jpg" alt="肉圓" class="food-image">
        <div class="food-info">
            <h2>1. 彰化肉圓</h2>
            <p>彰化最出名的代表性美食！外皮Q彈、內餡紮實，搭配獨門的甜鹹醬汁。無論是北門口肉圓的酥脆外皮，還是阿三肉圓的豐富層次，都是必吃首選。</p>
        </div>
    </div>

    <div class="food-card">
        <img src="https://img.ltn.com.tw/Upload/food/page/2016/06/26/160626-2203-000-XYvlx.jpg" alt="爌肉飯" class="food-image">
        <div class="food-info">
            <h2>2. 爌肉飯</h2>
            <p>彰化人的早餐到宵夜都能看到它的蹤影。精選肥瘦比例適中的五花肉，滷至軟嫩入味、入口即化，配上一碗白飯，簡單卻極致美味。</p>
        </div>
    </div>

    <div class="food-card">
        <img src="https://img.bigmouthblog.tw/2017/07/1499889200-48cab3bafb089e9bd61bb0f814e0dd1e.jpg" alt="貓鼠麵" class="food-image">
        <div class="food-info">
            <h2>3. 貓鼠麵</h2>
            <p>名字雖然奇特，但其實是因為第一代老闆生肖屬鼠且動作敏捷而得名。清甜的海鮮熬製湯頭配上手工麵條，是彰化市傳承百年的清爽滋味。</p>
        </div>
    </div>
    <div style="text-align: center; margin-top: 40px;">
        <a href="index.html" class="back-home">回到首頁</a>
    </div>

    <footer>
        <p>&copy; 2026 彰化一網通</p>
    </footer>
  
</body>
</html>
