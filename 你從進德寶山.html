<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <title>你從進德寶山</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .strava-header {
            background-color: #fc4c02; /* Strava 招牌橘色 */
            color: white;
            padding: 20px;
            text-align: center;
        }
        .intro-text {
            padding: 20px;
            background: #fff5f0;
            border-left: 5px solid #fc4c02;
            margin: 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        /* 運動數據列 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 20px;
            text-align: center;
        }
        .stat-item {
            border-right: 1px solid #eee;
        }
        .stat-item:last-child { border-right: none; }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fc4c02;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #777;
            text-transform: uppercase;
        }
        /* 地圖軌跡模擬區 */
        .map-placeholder {
            margin: 20px;
            height: 250px;
            background-color: #e5e3df;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .map-line {
            width: 80%;
            height: 60%;
            border: 3px dashed #fc4c02;
            border-radius: 50% 20% 40% 10%;
            position: absolute;
        }
        /* 報名表單區 */
        .form-section {
            padding: 30px;
            background-color: #fafafa;
            border-top: 1px solid #eee;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-gps {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 8px;
            transition: background 0.3s;
        }
        .btn-gps:hover {
            background-color: #1a252f;
        }
        .gps-display {
            font-size: 0.9rem;
            color: #666;
            margin: 5px 0 15px 0;
            background: #fff;
            padding: 8px;
            border-radius: 5px;
            border: 1px dashed #ccc;
            display: inline-block;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-submit {
            flex: 1;
            background-color: #fc4c02;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #e24301;
        }
        .btn-reset {
            flex: 1;
            background-color: #999;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn-reset:hover {
            background-color: #888;
        }
        .footer-link {
            text-align: center;
            padding: 20px;
        }
        .footer-link a {
            color: #fc4c02;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="straft-header" class="strava-header">
        <h1>🏃 你從進德寶山</h1>
    </div>

    <div class="intro-text">
        彰師大進德到寶山 4.5 公里，用跑的就到啦！
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-value">4.50 km</div>
            <div class="stat-label">距離</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">6'15"</div>
            <div class="stat-label">平均配速</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">28:07</div>
            <div class="stat-label">時間</div>
        </div>
    </div>

    <div class="map-placeholder">
        <div class="map-line"></div>
        <span style="color: #666; font-style: italic;">[ 運動軌跡：進德校區 ➔ 寶山校區 ]</span>
    </div>

    <div class="form-section">
        <h3 style="text-align: center;">挑戰者報名表</h3>
        
        <form action="marathon_submit.php" method="post">
            
            <input type="hidden" name="lat" id="hidden_lat" value="">
            <input type="hidden" name="lng" id="hidden_lng" value="">

            <div class="input-group">
                <label for="date">挑戰日期</label>
                <input type="text" name="date" id="date" placeholder="YYYY-MM-DD" required />
            </div>
            
            <div class="input-group">
                <label for="name">跑者姓名</label>
                <input type="text" name="name" id="name" placeholder="請輸入姓名" required />
            </div>
            
            <div class="input-group">
                <label>起跑位置定位</label>
                <button type="button" class="btn-gps" onClick="getLocation()">一鍵定位！</button>
                <div id="demo" class="gps-display">尚未定位（選填，可點擊上方按鈕獲取位置）</div>
                
                <script>
                const x = document.getElementById("demo");
                const hiddenLat = document.getElementById("hidden_lat");
                const hiddenLng = document.getElementById("hidden_lng");

                function getLocation() {
                    x.innerHTML = "定位中，請稍候...";
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(success, error);
                    } else {
                        x.innerHTML = "您的瀏覽器不支援地理定位。";
                    }
                }

                function success(position) {
                    // 1. 將經緯度填入隱藏欄位
                    hiddenLat.value = position.coords.latitude;
                    hiddenLng.value = position.coords.longitude;
                    // 2. 顯示在畫面上給使用者確認
                    x.innerHTML = "定位成功！<br>緯度 (Lat): " + position.coords.latitude + "<br>經度 (Lng): " + position.coords.longitude;
                    x.style.color = "#27ae60"; // 變成綠色代表成功
                    x.style.borderColor = "#27ae60";
                }

                function error(err) {
                    x.innerHTML = "無法取得位置（預設為：未定位）";
                    x.style.color = "#c0392b";
                    alert("提示：無法獲取 GPS 權限，您仍可正常提交表單。");
                }
                </script>
                
                <label style="margin-top: 10px;">挑戰類型</label>
                <div style="margin-top: 5px;">
                    <label style="font-weight: normal; margin-right: 15px; cursor: pointer;">
                        <input type="radio" name="type" value="run" checked> 認真跑步
                    </label>
                    <label style="font-weight: normal; cursor: pointer;">
                        <input type="radio" name="type" value="walk"> 散步健行
                    </label>
                </div>
            </div>
            
            <div class="btn-group">
                <input type="submit" class="btn-submit" value="開始挑戰" />
                <input type="reset" class="btn-reset" value="重新填寫" onclick="document.getElementById('demo').innerHTML='尚未定位（選填，可點擊上方按鈕獲取位置）'; document.getElementById('demo').style.color='#666'; document.getElementById('demo').style.borderColor='#ccc';" />
            </div>
        </form>
    </div>

    <div class="footer-link">
        <a href="index.html">← 回到彰化一網通首頁</a>
    </div>
</div>

</body>
</html>
