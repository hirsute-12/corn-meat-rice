<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <title>你從進德寶山 - 彰師校區馬拉松</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .strava-header {
            background-color: #fc4c02; /* Strava 招牌橘色 */
            color: white;
            padding: 20px;
            text-align: center;
        }
        .intro-text {
            padding: 20px;
            background: #fff5f0;
            border-left: 5px solid #fc4c02;
            margin: 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        /* 運動數據列 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 20px;
            text-align: center;
        }
        .stat-item {
            border-right: 1px solid #eee;
        }
        .stat-item:last-child { border-right: none; }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fc4c02;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #777;
            text-transform: uppercase;
        }
        /* 地圖軌跡模擬區 */
        .map-placeholder {
            margin: 20px;
            height: 250px;
            background-color: #e5e3df;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .map-line {
            width: 80%;
            height: 60%;
            border: 3px dashed #fc4c02;
            border-radius: 50% 20% 40% 10%;
            position: absolute;
        }
        /* 報名表單區 */
        .form-section {
            padding: 30px;
            background-color: #fafafa;
            border-top: 1px solid #eee;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

            color: white;
            border: none;
